# ── Scalar project settings ──────────────────────────────────────────────────
[project]
site_name = "Drove Container Orchestrator"
site_url  = "https://phonepe.github.io/drove-orchestrator"
repo_url  = "https://github.com/PhonePe/drove-orchestrator"
copyright = "Copyright &copy; 2024  PhonePe Private Limited"

nav = [
  {"Home" = "index.md"},
  {"Concepts" = [
    {"Overview" = "concepts/index.md"},
    {"Cluster Anatomy" = "concepts/cluster.md"},
    {"Scheduling" = "concepts/scheduling.md"},
    {"Placement Policies" = "concepts/placement-policies.md"},
    {"CPU, NUMA and Memory" = "concepts/cpu-numa-memory.md"},
    {"GPU Scheduling" = "concepts/gpu.md"},
    {"Security Profiles" = "concepts/security-profiles.md"}
  ]},
  {"Setup" = [
    {"Planning" = "cluster/setup/planning.md"},
    {"Prerequisites" = "cluster/setup/prerequisites.md"},
    {"Zookeeper" = "cluster/setup/zookeeper.md"},
    {"Controller" = "cluster/setup/controller.md"},
    {"Executor" = "cluster/setup/executor-setup.md"},
    {"Gateway" = "cluster/setup/gateway.md"},
    {"Coredns Drove" = "cluster/setup/coredns-drove.md"},
    {"Metrics" = "cluster/metrics.md"},
    {"Environment Info" = "cluster/environment-info.md"},
    {"Maintenance" = "cluster/maintenance.md"},
    {"Migration Guide" = "cluster/setup/migrating.md"}
  ]},
  {"Applications" = [
    {"Overview" = "applications/index.md"},
    {"Instances" = "applications/instances.md"},
    {"Specification" = "applications/specification.md"},
    {"Operations" = "applications/operations.md"},
    {"Outage" = "applications/outage.md"}
  ]},
  {"Local Services" = [
    {"Overview" = "localservices/index.md"},
    {"Instances" = "localservices/instances.md"},
    {"Specification" = "localservices/specification.md"},
    {"Operations" = "localservices/operations.md"},
    {"Outage" = "localservices/outage.md"}
  ]},
  {"Tasks" = [
    {"Overview" = "tasks/index.md"},
    {"Specification" = "tasks/specification.md"},
    {"Operations" = "tasks/operations.md"}
  ]},
  {"API Reference" = [
    {"Overview" = "apis/index.md"},
    {"Application" = "apis/application.md"},
    {"Local Service" = "apis/localservice.md"},
    {"Task" = "apis/task.md"},
    {"Logs" = "apis/logs.md"},
    {"Cluster" = "apis/cluster.md"}
  ]},
  {"Drove CLI" = [
    {"Overview" = "cli/index.md"},
    {"Configuration" = "cli/configuration.md"},
    {"Commands" = [
      {"App Instances" = "cli/commands/appinstances.md"},
      {"Apps" = "cli/commands/apps.md"},
      {"Cluster" = "cli/commands/cluster.md"},
      {"Config" = "cli/commands/config.md"},
      {"Describe" = "cli/commands/describe.md"},
      {"Executor" = "cli/commands/executor.md"},
      {"Local Services" = "cli/commands/localservices.md"},
      {"Local Service Instances" = "cli/commands/lsinstances.md"},
      {"Tasks" = "cli/commands/tasks.md"}
    ]}
  ]},
  {"Extra" = [
    {"Epoch" = "extra/epoch.md"},
    {"Libraries" = "extra/libraries.md"}
  ]}
]

extra_css = ["stylesheets/extra.css"]

# NOTE: js/mermaid.mjs is NOT listed in extra_javascript. All mermaid
# diagrams are pre-rendered to inline SVG at build time (mermaid_svg.py +
# tools/render-mermaid.mjs), so the site does not load mermaid at runtime.
# docs/js/mermaid.mjs stays in the docs tree only as the renderer entry
# point. The exclude plugin below keeps the renderer and its vendored
# mermaid/ELK modules (about 9 MB) out of the published site.

# Serve the iframe-worker shim from the site itself. The offline plugin
# injects https://unpkg.com/iframe-worker/shim unless an entry with that
# name is already present in this list.
[[project.extra.polyfills]]
path = "js/vendor/iframe-worker/iframe-worker.js"

# ── Theme ─
[project.theme]
custom_dir = "overrides"
features = [
  "navigation.tracking",
  "navigation.path",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "content.code.copy",
  "content.code.annotate",
  "navigation.expand",
  "toc.follow",
  "navigation.top",
  "search.suggest",
  "search.highlight",
  "search.share"
]

[[project.theme.palette]]
media  = "(prefers-color-scheme: light)"
scheme = "default"

[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme)"

[project.theme.palette.toggle]
icon = "material/brightness-auto"
name = "Switch to light mode"

[[project.theme.palette]]
media  = "(prefers-color-scheme: dark)"
scheme = "slate"

[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to system preference"

# ── Plugins (search and minify are built-in — omitted) ───────────────────────
[project.plugins.glightbox]
width = "auto"
height = "auto"
skip_classes = []
auto = true
auto_themed = false
auto_caption = false
caption_position = "bottom"

[project.plugins.awesome-pages]

[project.plugins.privacy]
enabled          = false
cache            = true
cache_dir        = ".cache/plugins/privacy"
assets           = true
assets_fetch     = true
assets_fetch_dir = "assets/external"
[project.plugins.offline]
enabled = true

# Keep the renderer parts (mermaid.mjs + vendored mermaid/ELK, about 9 MB)
# out of the published site: diagrams are pre-rendered SVGs now. The
# vendored iframe-worker and glightbox files stay: the theme bundle needs
# them at runtime.
[project.plugins.exclude]
glob = ["js/mermaid.mjs", "js/vendor/mermaid/**", "js/vendor/layout-elk/**"]

# ── Markdown extensions ─
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.admonition]

[project.markdown_extensions.tables]

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [
  {name = "mermaid", class = "mermaid", format = "mermaid_svg.format_mermaid_svg"}
]

[project.markdown_extensions."pymdownx.emoji"]
emoji_index     = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions."markdown_include.include"]
base_path = "snippets"

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.com/channels/1499047503025410148/1499049023229792327"
name = "Join our Discord"


